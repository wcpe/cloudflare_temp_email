name: Tag Build CI

on:
  push:
    tags:
      - "*"

jobs:
  # 三个产物 + release 合并为单 job：同 run 跨 job 的 actions/cache
  # 传递实测不可靠，产物全部留在本 job 工作区，构建完直接上传。
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          version: 10
          run_install: false

      - name: Build Frontend
        run: cd frontend && pnpm install --no-frozen-lockfile && pnpm build:release

      - name: Zip Frontend dist
        run: cd frontend/dist/ && zip -r ../frontend.zip * && cd .. && mkdir -p ../artifacts/frontend && mv frontend.zip ../artifacts/frontend/

      - name: Build Telegram Frontend
        run: cd frontend && pnpm build:telegram:release

      - name: Zip Telegram Frontend dist
        run: cd frontend/dist/ && zip -r ../telegram-frontend.zip * && cd .. && mkdir -p ../artifacts/telegram-frontend && mv telegram-frontend.zip ../artifacts/telegram-frontend/

      - name: cp wrangler.toml
        run: cd worker && cp wrangler.toml.template wrangler.toml

      - name: Build Backend
        run: cd worker && pnpm install --no-frozen-lockfile && pnpm build

      - name: Move worker.js
        run: cd worker && mkdir -p ../artifacts/worker-js && cp dist/worker.js ../artifacts/worker-js/worker.js

      - name: Build Worker with wasm mail parser
        run: |
          cd worker
          echo "Using mail-parser-wasm-worker"
          pnpm add mail-parser-wasm-worker
          git apply ../.github/config/mail-parser-wasm-worker.patch
          echo "Applied mail-parser-wasm-worker patch"
          pnpm build
          zip -r worker-with-wasm-mail-parser.zip dist/worker.js dist/*.wasm
          mkdir -p ../artifacts/worker-wasm
          mv worker-with-wasm-mail-parser.zip ../artifacts/worker-wasm/

      - name: Upload Assets to Release
        run: |
          gh release upload "${{ github.ref_name }}"             artifacts/frontend/frontend.zip             artifacts/telegram-frontend/telegram-frontend.zip             artifacts/worker-js/worker.js             artifacts/worker-wasm/worker-with-wasm-mail-parser.zip             --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
