name: End-to-End Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Run E2E tests
        run: |
          cd e2e
          docker compose up --build --abort-on-container-exit --exit-code-from e2e-runner

      - name: Cleanup
        if: always()
        run: |
          cd e2e
          docker compose down -v
